name: HUDDLE checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: SQLite regression and deployment adapter
        run: python -m unittest discover -s tests -v
      - name: PostgreSQL through the production WSGI entrypoint
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
          TEST_ALLOW_RESET: '1'
        run: python scripts/test_postgres.py
